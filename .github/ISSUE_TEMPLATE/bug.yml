name: Bug report
description: Something in Operandi doesn't work, crashes or looks wrong.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Got an idea instead of a bug? [Suggest an idea](https://github.com/operandi3d/operandi/issues/new?template=idea.yml).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see? Screenshots or a screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The clicks or keys that make it happen, starting from a new scene if you can.
      placeholder: |
        1. New scene, add a Cube
        2. Select the top polygon
        3. Bevel and drag
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Filled in by Operandi when you use Help > Report Bug or Idea. Edit out anything you don't want to share.
      render: text
    validations:
      required: false
