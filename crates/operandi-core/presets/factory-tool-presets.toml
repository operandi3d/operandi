id = "ElementMove"
label = "Element Move"
group = "deform.move"
actor = { tool = "Tweak" }
auto_activate = false  # CS-01: waits for a click

[[preset]]
id = "xfrm.magnet"
label = "Soft Move"
names = ["soft move"]
tooltip = "Move with its own Radial falloff: click to place both, then size the falloff with its boxes"
icon = "soft-move"
group = "deform.move"
layers = [{ slot = "falloff", kind = "radial", shape = "linear", at_tool = true }]
actor = { tool = "Move" }
auto_activate = false  # CS-01: Magnet (provisional: its id; the button says Soft Move)

[[preset]]
id = "xfrm.shear"
label = "Shear"
names = ["shear"]
tooltip = "Move with a Linear falloff: one end moves, the other stays"
icon = "shear"
group = "deform.move"
layers = [{ slot = "falloff", kind = "linear", shape = "linear" }]
actor = { tool = "Move" }
auto_activate = false  # CS-01: waits for a click

[[preset]]
