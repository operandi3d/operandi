# Factory tool presets: the recipe table (specifications/tool-presets-2026-11-15).
#
# Each [[preset]] is one button: which pipe layers it puts in place, then
# which tool (the actor) it starts and with which values. Operandi reads this
# file at start; user presets (stage 2) will use the same format.
#
#   id       the script name, `tool.set <id> on` (TP-01)
#   label    the button and history name
#   names    extra command-line phrases that start it (old Operandi names)
#   tooltip, icon (a generator slug), group (where the button sits)
#   layers   slot + kind + values, in pipe order (TP-03). Slots this preset
#            doesn't name keep whatever the user had (TP-10), and every slot
#            it names goes back to the user's layer when the tool drops
#            (TP-12).
#   actor    tool = an Operandi tool, or operation = a one-shot command,
#            plus the values that differ from the tool's own (TP-04)
#
# Layer kinds:
#   slot = "action_center", center = automatic | selection | selection_border | origin
#   slot = "action_axis",   axis = world | selection | selection_all | auto (Selection needs selected
#                           polygons; otherwise the user's axis stays, SF-Q6;
#                           auto = the tool's own X/Y/Z row on World axes)
#   slot = "falloff",       kind = linear | radial | cylinder | selection |
#                           soft_selection | element | screen, shape =
#                           linear | ease_in | ease_out | smooth. Linear and
#                           Radial are fitted to the selection (FO-04, TP-17).
#                           at_tool = true (TP-19): a Radial or Cylinder
#                           falloff keeps its fitted size but starts centred
#                           where the tool is placed (its first click).
#   slot = "snapping",      target = points, radius_px: the tool's own snap
#                           (separate from the user's Snapping settings)
#
#   auto_activate  (CS-01/05) false: picking the row only arms the tool;
#            the first left click in a 3D view makes it live, and Apply
#            runs it once with the panel's values. Unset: the tool's own
#            [[tool]] row at the end of this file, else true (live at once).
#
# Actors: tool = an editor tool by its enum name; operation = flip_it; or
# app = the command-line phrase of a mode the app runs itself (Weld, the
# Align tools).

# Deform tab, Move Tools ---------------------------------------------------

