[package]
name = "operandi-layout"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Workspace layout model: panes in splits and tab groups, torn-off windows, saved layouts"

[dependencies]
egui = { version = "0.33", default-features = false, features = ["serde"] }
egui_tiles = { version = "=0.14.1", default-features = false, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
egui-wgpu = "0.33"
